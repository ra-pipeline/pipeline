name: "Test-Unit (Pixi)"

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "pipeline/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "MANIFEST.in"
  pull_request:
    branches:
      - "**"
  # Allow manual triggering
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        pixi_env:
          - casa674-py312
          - casa676-py312
          - casa676-py313
          - casa677-py312
          - casa677-py313
    name: "Unit Testing (${{ matrix.os }}, ${{ matrix.pixi_env }})"

    uses: ./.github/workflows/env-setup-run-template-pixi.yml
    with:
      os: ${{ matrix.os }}
      pixi_env: ${{ matrix.pixi_env }}
      test_data: unit
      task: test-unit
      # Only upload artifacts for a single reference configuration:
      #   - ubuntu-latest OS
      #   - casa674-py312 environment
      #
      # Other matrix combinations (macOS and newer CASA versions) run tests
      # for compatibility coverage, but do not upload artifacts to avoid race
      # conditions and conflicting uploads. Downstream upload_codecov is wired
      # to download this specific artifact name: "pytest-results-ubuntu-latest".
      #
      # Standard GitHub Runner specs:
      #   ubuntu-latest: 4 vCPUs / 16 GB RAM (public), 2 vCPUs / 8 GB RAM (private)
      #   macos-latest:  3 vCPUs / 7 GB RAM (M1 Apple Silicon)
      # (pytest uses '-n logical' in pixi task to auto-scale across runner cores).
      artifact_name: ${{ (matrix.os == 'ubuntu-latest' && matrix.pixi_env == 'casa674-py312') && 'pytest-results-ubuntu-latest' || '' }}
      artifact_path: |
        coverage.xml
        htmlcov/
        junit.xml

  upload_codecov:
    name: Upload Coverage to CodeCov
    needs: test
    runs-on: ubuntu-latest
    if: needs.test.result == 'success'
    steps:
      - name: Checkout Full History for Codecov
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          name: pytest-results-ubuntu-latest

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-ubuntu-latest
          fail_ci_if_error: true
          verbose: true
          disable_telem: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
