name: Sync from On-Prem Bitbucket

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview branch and tag updates and deletions"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: sync-from-open-bitbucket
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror branches and tags
        shell: bash
        env:
          BITBUCKET_URL: https://open-bitbucket.nrao.edu/scm/pipe/pipeline.git
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          GH_TOKEN: ${{ secrets.MIRROR_PAT }}
        run: |
          mirror_dir=$(mktemp -d "$RUNNER_TEMP/bitbucket-mirror.XXXXXX")
          git init --bare --quiet "$mirror_dir"

          refspecs=('+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*')
          fetched=false
          delay=5
          for attempt in 1 2 3 4; do
            if git -C "$mirror_dir" \
              -c http.lowSpeedLimit=1000 \
              -c http.lowSpeedTime=30 \
              -c http.postBuffer=524288000 \
              fetch --quiet --no-tags "$BITBUCKET_URL" "${refspecs[@]}"; then
              fetched=true
              break
            fi
            if [[ "$attempt" -lt 4 ]]; then
              echo "Fetch failed (attempt $attempt/4). Retrying in ${delay}s..." >&2
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          if [[ "$fetched" != true ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
              echo "::warning::open-bitbucket.nrao.edu appears offline or unreachable. Skipping scheduled sync."
              exit 0
            fi
            echo "::error::Failed to fetch from $BITBUCKET_URL after 4 attempts."
            exit 1
          fi

          git -C "$mirror_dir" show-ref --verify refs/heads/main

          gh auth setup-git
          push_options=(--atomic --prune --porcelain)
          if [[ "$DRY_RUN" == true ]]; then
            push_options+=(--dry-run)
          fi
          git -C "$mirror_dir" push "${push_options[@]}" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "${refspecs[@]}"
