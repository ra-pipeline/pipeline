name: "Template: Environment Setup and Run (Pixi)"

on:
  workflow_call:
    inputs:
      os:
        description: "Operating System to run on"
        required: false
        default: "ubuntu-24.04"
        type: string
      container:
        description: "Optional container image for Linux jobs (e.g., 'almalinux:8')"
        required: false
        default: ""
        type: string
      pixi_env:
        description: "Pixi environment name (from pyproject.toml)"
        required: false
        default: "default"
        type: string
      update_casa:
        description: "Update CASA packages within manifest constraints before testing"
        required: false
        default: false
        type: boolean
      test_data:
        description: "Type of test data to checkout (e.g., 'unit', 'regression-smoke', or 'none')"
        required: false
        default: "none"
        type: string
      testdata_paths:
        description: "Newline-separated sparse-checkout paths for pipeline-testdata (defaults to .github/testdata-paths.txt)"
        required: false
        default: ""
        type: string
      free_disk_space:
        description: "Reclaim disk space on Linux runners before setup"
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: "Maximum job runtime in minutes"
        required: false
        default: 360
        type: number
      task:
        description: "Pixi task name to run (e.g., 'test-unit')"
        required: false
        default: ""
        type: string
      run_command:
        description: "Bash commands to run inside the pixi env (used if task is empty)"
        required: false
        default: ""
        type: string
      artifact_name:
        description: "Name of the artifact to upload"
        required: false
        default: ""
        type: string
      artifact_path:
        description: "Path of files to upload"
        required: false
        default: ""
        type: string

jobs:
  run-in-env:
    name: Run in Pixi Env
    if: inputs.container == '' || startsWith(inputs.os, 'macos')
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Free disk space (Ubuntu)
        if: inputs.free_disk_space && runner.os == 'Linux'
        shell: bash
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! dpkg -s ca-certificates git xvfb >/dev/null 2>&1; then
            APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
            sudo apt-get $APT_OPTS update -y
            sudo -E apt-get $APT_OPTS install -y --no-install-recommends ca-certificates git xvfb
          fi

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        run: |
          # GH macOS runners use Homebrew for package management
          brew install git
          # casaplotms on macOS is native Qt (Cocoa), not X11, but task_plotms.py
          # still requires DISPLAY to be set and pytest-xvfb does not start Xvfb
          # on macOS; start XQuartz Xvfb so DISPLAY points to a valid server.
          brew install --cask xquartz
          if [ -x /opt/X11/bin/Xvfb ]; then
            /opt/X11/bin/Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup and Run in Pixi Env
        uses: ./.github/actions/setup-run-pixi
        with:
          pixi_env: ${{ inputs.pixi_env }}
          update_casa: ${{ inputs.update_casa }}
          test_data: ${{ inputs.test_data }}
          testdata_paths: ${{ inputs.testdata_paths }}
          task: ${{ inputs.task }}
          run_command: ${{ inputs.run_command }}
          artifact_name: ${{ inputs.artifact_name }}
          artifact_path: ${{ inputs.artifact_path }}

  run-in-container:
    name: Run in Pixi Container
    if: inputs.container != '' && !startsWith(inputs.os, 'macos')
    runs-on: ${{ inputs.os }}
    container: ${{ inputs.container }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - name: Install System Dependencies (Container)
        timeout-minutes: 5
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y --setopt=install_weak_deps=False --setopt=timeout=30 --setopt=retries=3 \
              ca-certificates dbus-libs findutils fontconfig git git-lfs gzip mesa-libGL procps-ng tar which xorg-x11-server-Xvfb
            dnf clean all
          elif command -v apt-get >/dev/null 2>&1; then
            APT_OPTS="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
            apt-get $APT_OPTS update -y
            apt-get $APT_OPTS install -y --no-install-recommends \
              ca-certificates curl findutils fontconfig git git-lfs gzip libgl1 procps tar xvfb
            rm -rf /var/lib/apt/lists/*
          fi
          git config --system --add safe.directory '*'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup and Run in Pixi Env
        uses: ./.github/actions/setup-run-pixi
        with:
          pixi_env: ${{ inputs.pixi_env }}
          update_casa: ${{ inputs.update_casa }}
          test_data: ${{ inputs.test_data }}
          testdata_paths: ${{ inputs.testdata_paths }}
          task: ${{ inputs.task }}
          run_command: ${{ inputs.run_command }}
          artifact_name: ${{ inputs.artifact_name }}
          artifact_path: ${{ inputs.artifact_path }}
